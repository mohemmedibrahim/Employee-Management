<div class="app-shell">
  <!-- Left sidebar -->
  <aside class="sidebar" [class.open]="sidebarOpen()" aria-label="Main navigation">
    <a class="brand" routerLink="/dashboard">
      <span class="brand-mark"><app-icon name="employees" [size]="22" /></span>
      <span class="brand-text">
        <strong>Employee</strong>
        <small>Management System</small>
      </span>
    </a>

    <nav class="nav">
      <p class="nav-heading">Menu</p>
      @for (item of navItems; track item.path) {
        <a class="nav-link" [routerLink]="item.path" routerLinkActive="active">
          <app-icon [name]="item.icon" [size]="20" />
          <span>{{ item.label }}</span>
        </a>
      }
    </nav>

    <p class="sidebar-footer">Admin Dashboard</p>
  </aside>

  @if (sidebarOpen()) {
    <div class="sidebar-backdrop" (click)="closeSidebar()"></div>
  }

  <!-- Top bar + content -->
  <div class="main">
    <header class="topbar">
      <button type="button" class="icon-btn menu-btn" aria-label="Toggle navigation menu" (click)="toggleSidebar()">
        <app-icon name="menu" [size]="22" />
      </button>

      <h2 class="topbar-title">{{ pageTitle() }}</h2>

      <div class="topbar-right">
        <span class="topbar-date">
          <app-icon name="calendar" [size]="16" />
          {{ today | date: 'EEE, d MMM yyyy' }}
        </span>
        <a class="btn btn-primary btn-sm" routerLink="/employees/new">
          <app-icon name="plus" [size]="16" />
          <span class="hide-mobile">Add Employee</span>
        </a>
      </div>
    </header>

    <main class="content">
      <router-outlet />
    </main>
  </div>
</div>

<app-toast-container />
<app-confirm-dialog />
